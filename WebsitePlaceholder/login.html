<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Neie Naober</title>

    <!-- Your existing CSS files -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/typography.css">

    <style>
        /* Login Page Styling */
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            margin: 80px auto;
            background: #111;
            padding: 30px;
            border-radius: 8px;
            color: #fff;
        }

        .login-wrapper h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
            font-weight: 600;
        }

        .login-wrapper label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .login-wrapper input[type="text"],
        .login-wrapper input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* Radial Menu Styling */
        .radial-wrapper {
            position: relative;
            width: 100%;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
        }

        .radial-trigger {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #222;
            border: 2px solid #444;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            z-index: 2;
            transition: all 0.3s ease;
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
            user-select: none;
        }

        .radial-trigger:hover {
            border-color: red;
        }

        .radial-options {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .radial-options.active {
            pointer-events: auto;
        }

        .radial-btn {
            position: absolute;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 2px solid #444;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
        }

        .radial-options.active .radial-btn {
            opacity: 1;
        }

        .radial-options.active .radial-btn[data-value="organization"] {
            transform: translateX(-95px) scale(1);
        }

        .radial-options.active .radial-btn[data-value="vip"] {
            transform: translateX(95px) scale(1);
        }

        .radial-btn:hover,
        .radial-btn.selected {
            border-color: red;
            background: #330000;
        }

        .login-wrapper button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: red;
            border: none;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            border-radius: 4px;
        }

        .login-wrapper button[type="submit"]:hover {
            background: #b30000;
        }

        .login-info {
            margin-top: 20px;
            font-size: 13px;
            text-align: center;
            color: #ccc;
        }
    </style>
</head>

<body>

<section class="sub-header">
    <nav class="logo">
        <div class="nav-links">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="over-ons.html">OVER ONS</a></li>
                <li><a href="agenda.html">AGENDA</a></li>
                <li><a href="nieuws.html">NIEUWS</a></li>
                <li><a href="werken-bij.html">WERKEN BIJ</a></li>
                <li><a href="login.html">LOGIN</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </div>
    </nav>
</section>

<!-- ============================
     LOGIN FORM
=============================== -->
<div class="login-wrapper">
    <h2>Inloggen</h2>

    <form id="loginForm">
        <label>Login type</label>
        <div class="radial-wrapper">
            <input type="hidden" id="loginType" name="loginType" required>
            <div class="radial-trigger" id="radialTrigger">Kies type</div>
            <div class="radial-options" id="radialOptions">
                <button type="button" class="radial-btn" data-value="organization">Organisatie</button>
                <button type="button" class="radial-btn" data-value="vip">VIP</button>
            </div>
        </div>

        <label for="username">Gebruikersnaam</label>
        <input type="text" id="username" placeholder="Gebruikersnaam" required>

        <label for="password">Wachtwoord</label>
        <input type="password" id="password" placeholder="Wachtwoord" required>

        <button type="submit">Inloggen</button>
    </form>

    <div class="login-info">
        <p>Gebruik je organisatie- of VIP-account om toegang te krijgen tot vrijwilligersgegevens.</p>
    </div>
</div>

<script>
    const trigger = document.getElementById("radialTrigger");
    const options = document.getElementById("radialOptions");
    const buttons = document.querySelectorAll(".radial-btn");
    const hiddenInput = document.getElementById("loginType");

    trigger.addEventListener("click", function() {
        options.classList.toggle("active");
    });

    buttons.forEach(function(btn) {
        btn.addEventListener("click", function() {
            const val = this.getAttribute("data-value");
            hiddenInput.value = val;
            trigger.textContent = this.textContent;
            trigger.style.borderColor = "red";

            buttons.forEach(function(b) {
                b.classList.remove("selected");
            });
            this.classList.add("selected");

            options.classList.remove("active");
        });
    });

    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const type = hiddenInput.value;

        if (!type) {
            alert("Selecteer een login type.");
            trigger.style.borderColor = "red";
            return;
        }

        // FLOWCHART LOGIC
        if (type === "organization") {
            window.location.href = "organization-dashboard.html";
        }

        if (type === "vip") {
            window.location.href = "vip-dashboard.html";
        }
    });
</script>

</body>
</html>
